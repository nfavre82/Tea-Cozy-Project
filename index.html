<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="styles.css" rel="stylesheet">
    <title>Tea Cozy Shop</title>
</head>
<body>
    <header class="header-container">
        <img class="tea-cozy-logo" src="assets/img-tea-cozy-logo.png" alt="This is the logo of the Tea Cozy Shop">
        </div>
        <ul class="menu-container">
            <li><a class="menu-links" href="#mission">Mission</a></li>
            <li><a class="menu-links" href="#featured-tea">Featured Tea</a></li>
            <li><a class="menu-links" href="#locations">Locations</a></li>
        </ul>
    </header>

    <main>
        <section class="mission-container">
            <div class="banner-container">
                <h2 id="mission">Our Mission</h2>
                <h4>Handpicked, Artisanally Curated, Free Range, Sustainable, Small Batch, Fair Trade, Organic Tea</h4>
            </div>       
        </section>

        <section class="featured-tea">

            <div>
                <h2 id="featured-tea">Tea of the Month</h2>
                <h4 class="featured-tea-heading">What's Steeping at The Tea Cozy?</h4>
            </div>

            <div class="flexbox-grid">
                <div class="featured-tea-images-container">
                    <img class="featured-tea-images" src="assets/img-berryblitz.jpg" alt="This is a mix of tea leaves and berries.">
                    <h4 class="tea-label">Fall Berry Blitz Tea</h4>
                </div>
            
                <div class="featured-tea-images-container">
                    <img class="featured-tea-images" src="assets/img-spiced-rum.jpg" alt="This is a mix of tea leaves, spices and rum.">
                    <h4 class="tea-label">Spiced Rum Tea</h4>
                </div>

                <div class="featured-tea-images-container">
                    <img class="featured-tea-images" src="assets/img-donut.jpg" alt="This is a delicious donut.">
                    <h4 class="tea-label">Seasonal Donuts</h4>
                </div>

                <div class="featured-tea-images-container">
                    <img class="featured-tea-images" src="assets/img-myrtle-ave.jpg" alt="This is a delicious pastry made with myrtle and tea.">
                    <h4 class="tea-label">Myrtle Ave Tea</h4>
                </div>

                <div class="featured-tea-images-container">
                    <img class="featured-tea-images" src="assets/img-bedford-bizarre.jpg" alt="This is a delicious variety of tea.">
                    <h4 class="tea-label">Bedford Bizarre Tea</h4>
                </div>
            </div>
            
        </section>
    </main>
    <footer>

    </footer>

</body>
</html>
